<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.9/babel.min.js"></script>
    <style>
    body {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        min-height: 100vh;
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        color: #e0e0e0;
    }

    .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem;
    }

    .title {
        font-size: 2.5rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 2rem;
        color: #00d4ff;
        text-transform: uppercase;
    }

    .card {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .story-text {
        max-height: 300px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.2);
        padding: 1rem;
        border-radius: 8px;
        line-height: 1.5;
        font-size: 1.1rem;
    }

    .btn {
        background: linear-gradient(90deg, #00d4ff, #007bff);
        border: none;
        border-radius: 8px;
        color: white;
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: block;
        margin: 1rem auto 0;
    }

    .btn:hover {
        background: linear-gradient(90deg, #007bff, #00d4ff);
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .input-field {
        width: 100%;
        max-width: 400px;
        margin: 0 auto 1rem auto;
        display: block;
        padding: 0.8rem;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: #e0e0e0;
        font-size: 1rem;
    }

    .input-field::placeholder {
        color: rgba(255, 255, 255, 0.4);
    }

    .select-option {
        padding: 1rem;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.05);
    }

    .select-option:hover {
        background: rgba(255, 255, 255, 0.15);
    }

    .select-option.selected {
        background: linear-gradient(90deg, #007bff, #00d4ff);
        color: white;
    }

    .story-image {
        max-width: 100%;
        height: auto;
        border-radius: 12px;
        margin: 1rem auto;
        display: block;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .audio-controls {
        margin-top: 1rem;
        display: flex;
        gap: 1rem;
        justify-content: center;
    }

    .grid {
        display: grid;
    }

    .grid-cols-2 {
        grid-template-columns: repeat(2, 1fr);
    }

    .grid-cols-3 {
        grid-template-columns: repeat(3, 1fr);
    }

    .gap-4 {
        gap: 1rem;
    }

    .text-center {
        text-align: center;
    }

    /* Media Queries for Responsiveness */
    @media (max-width: 600px) {
        .container {
            padding: 1rem;
        }

        .title {
            font-size: 2rem;
        }

        .grid-cols-2, .grid-cols-3 {
            grid-template-columns: 1fr;
        }

        .select-option {
            padding: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
        }
    }
</style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const API_BASE = window.location.origin;
            const [step, setStep] = useState(1);
            const [title, setTitle] = useState('');
            const [storyType, setStoryType] = useState('adventure');
            const [length, setLength] = useState('short');
            const [tone, setTone] = useState('fun');
            const [storyData, setStoryData] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            const storyTypes = [
                { value: 'adventure', label: 'Adventure' },
                { value: 'animal', label: 'Animal Friends' },
                { value: 'friendship', label: 'Friendship' },
                { value: 'fairy-tale', label: 'Fairy Tale' },
                { value: 'space', label: 'Space Adventure' },
                { value: 'ocean', label: 'Ocean Adventure' }
            ];

            const lengths = [
                { value: 'short', label: 'Short' },
                { value: 'medium', label: 'Medium' },
                { value: 'long', label: 'Long' }
            ];

            const tones = [
                { value: 'fun', label: 'Fun' },
                { value: 'exciting', label: 'Exciting' },
                { value: 'gentle', label: 'Gentle' },
                { value: 'funny', label: 'Funny' },
                { value: 'magical', label: 'Magical' }
            ];

            const handleSubmit = async () => {
                setIsLoading(true);
                setError('');
                try {
                    const response = await fetch(`${API_BASE}/create-story`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ 
                            title: title.trim(), 
                            storyType, 
                            length, 
                            tone 
                        })
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    if (data.error) throw new Error(data.error);
                    setStoryData(data);
                    setStep(5);
                } catch (error) {
                    console.error('Error creating story:', error);
                    setError(`Failed to create story: ${error.message}`);
                }
                setIsLoading(false);
            };

            const resetForm = () => {
                setTitle('');
                setStoryType('adventure');
                setLength('short');
                setTone('fun');
                setStoryData(null);
                setError('');
                setStep(1);
            };

            const playAudio = () => {
                if (storyData?.audio) {
                    const audio = new Audio(`${API_BASE}/${storyData.audio}`);
                    audio.play();
                }
            };

            const renderStep = () => {
                if (isLoading) {
                    return (
                        <div className="text-center">
                            <h2 className="title">Generating...</h2>
                            <p>Processing your story, please wait.</p>
                        </div>
                    );
                }
                if (error) {
                    return (
                        <div className="text-center">
                            <h2 className="title">Error</h2>
                            <p>{error}</p>
                            <button onClick={() => setError('')} className="btn">Retry</button>
                        </div>
                    );
                }
                switch (step) {
                    case 1:
                        return (
                            <div>
                                <h2 className="title">Story Title</h2>
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    placeholder="Enter title..."
                                    className="input-field"
                                />
                                <button onClick={() => title.trim() ? setStep(2) : alert('Enter a title')} className="btn">Next</button>
                            </div>
                        );
                    case 2:
                        return (
                            <div>
                                <h2 className="title">Story Type</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    {storyTypes.map(type => (
                                        <div
                                            key={type.value}
                                            onClick={() => setStoryType(type.value)}
                                            className={`select-option ${storyType === type.value ? 'selected' : ''}`}
                                        >
                                            {type.label}
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setStep(3)} className="btn">Next</button>
                            </div>
                        );
                    case 3:
                        return (
                            <div>
                                <h2 className="title">Length</h2>
                                <div className="grid grid-cols-3 gap-4">
                                    {lengths.map(len => (
                                        <div
                                            key={len.value}
                                            onClick={() => setLength(len.value)}
                                            className={`select-option ${length === len.value ? 'selected' : ''}`}
                                        >
                                            {len.label}
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setStep(4)} className="btn">Next</button>
                            </div>
                        );
                    case 4:
                        return (
                            <div>
                                <h2 className="title">Tone</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    {tones.map(t => (
                                        <div
                                            key={t.value}
                                            onClick={() => setTone(t.value)}
                                            className={`select-option ${tone === t.value ? 'selected' : ''}`}
                                        >
                                            {t.label}
                                        </div>
                                    ))}
                                </div>
                                <button onClick={handleSubmit} className="btn">Generate</button>
                            </div>
                        );
                    case 5:
                        return (
                            <div>
                                <h2 className="title">"{storyData?.title || title}"</h2>
                                <div className="story-text">
                                    <p>{storyData?.text}</p>
                                </div>
                                {storyData?.image && (
                                    <img src={`${API_BASE}/${storyData.image}`} alt="Story Image" className="story-image" />
                                )}
                                <div className="audio-controls">
                                    {storyData?.audio && (
                                        <button onClick={playAudio} className="btn">Play Narration</button>
                                    )}
                                    <button onClick={resetForm} className="btn">New Story</button>
                                </div>
                            </div>
                        );
                    default:
                        return null;
                }
            };

            return (
                <div className="container">
                    {renderStep()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
